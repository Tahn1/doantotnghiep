apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

try {
    apply plugin: 'kotlin-android'
    println "Configure OpenCV with Kotlin"
} catch (Exception e) {
    println "Configure OpenCV without Kotlin"
}

def openCVersionName = "4.11.0"
def openCVersionCode = 4110000

println "OpenCV: " + openCVersionName + " " + project.buildscript.sourceFile

android {
    namespace 'org.opencv'
    compileSdkVersion 34

    // KHÔNG dùng flavorDimensions / productFlavors
    // (Nếu app không còn flavor, ta cũng gỡ hẳn ở đây.)

    buildTypes {
        debug {
            // Tránh Gradle strip *.so
            packagingOptions {
                doNotStrip '**/*.so'
            }
        }
        release {
            packagingOptions {
                doNotStrip '**/*.so'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode openCVersionCode
        versionName openCVersionName

        // Cấu hình build native OpenCV
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                targets "opencv_jni_shared"
            }
        }
    }
     

    // Cho phép buildConfig & prefabPublishing
    buildFeatures {
        buildConfig true
        prefabPublishing true
    }

    // Java 17 (tuỳ ý, bạn có thể chuyển sang 1.8)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['native/libs']
            java.srcDirs = ['java/src']
            res.srcDirs = ['java/res']
            manifest.srcFile 'java/AndroidManifest.xml'
        }
    }

    externalNativeBuild {
        cmake {
            path (project.projectDir.toString() + '/libcxx_helper/CMakeLists.txt')
        }
    }

    // Nếu bạn muốn xuất prefab
    prefab {
        opencv_jni_shared {
            headers 'native/jni/include'
        }
    }

    // Xuất .aar
    publishing {
          multipleVariants {
        allVariants()
    }
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'org.opencv'
            artifactId = 'opencv'
            version = '4.11.0'

            afterEvaluate {
                from components.release
            }
        }
    }
    repositories {
        maven {
            name = 'myrepo'
            url = "${project.buildDir}/repo"
        }
    }
}